steps:
  # Build the API service with Hawanama Bot integration
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'apps/api/Dockerfile'
      - '-t'
      - 'asia-south1-docker.pkg.dev/hawanama-2/cloud-run-source-deploy/hawanama:latest'
      - '--build-arg'
      - 'HAWANAMA_BOT_ENABLED=true'
      - '--build-arg'
      - 'GIT_SHA=$_GIT_SHA'
      - '.'
    env:
      - 'DOCKER_BUILDKIT=1'

  # Push the image to registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/hawanama-2/cloud-run-source-deploy/hawanama:latest'

  # Deploy public read API: hawanama (user-facing, sized for low-latency reads)
  # Uses Secret Manager for sensitive credentials
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'hawanama'
      - '--image=asia-south1-docker.pkg.dev/hawanama-2/cloud-run-source-deploy/hawanama:latest'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--set-secrets=POSTGRES_SERVER=POSTGRES_SERVER:latest,POSTGRES_USER=POSTGRES_USER:latest,POSTGRES_PASSWORD=POSTGRES_PASSWORD:latest,POSTGRES_DB=POSTGRES_DB:latest,POSTGRES_PORT=POSTGRES_PORT:latest,TASKS_API_SECRET=TASKS_API_SECRET:latest,IQAIR_API_KEY=IQAIR_API_KEY:latest,NASA_API_KEY=NASA_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,LANGFUSE_SECRET_KEY=LANGFUSE_SECRET_KEY:latest,LANGFUSE_PUBLIC_KEY=LANGFUSE_PUBLIC_KEY:latest,PUNJAB_EPA_API_KEY=PUNJAB_EPA_API_KEY:latest,FIRMS_MAP_KEY=FIRMS_MAP_KEY:latest,PARTNER_API_KEYS=PARTNER_API_KEYS:latest'
      - '--set-env-vars=OPS_MODELS_BUCKET=paqi-models-hawanama-data,OPS_OUTPUTS_BUCKET=paqi-outputs-hawanama-data,OPS_FEATURES_BUCKET=paqi-features-hawanama-data,OPS_DERIVED_BUCKET=paqi-derived-hawanama-data,OPS_GCP_PROJECT=hawanama-data,OPS_RUN_REGION=asia-south1,OPS_DAILY_JOB_NAME=estimation-daily-pipeline,OPS_RETRAIN_JOB_NAME=estimation-model-retrain,MANIFEST_GCS_BUCKET=hawanama-manifests,ALLOW_DB_STATION_FALLBACK=true,IQAIR_MAX_CALLS_PER_MIN=500,INGEST_CONCURRENCY=10,LANGFUSE_HOST=https://us.cloud.langfuse.com,OPS_TABLES_REQUIRED=false,ENVIRONMENT=production'
      - '--cpu=2'
      - '--memory=2Gi'
      - '--concurrency=20'
      - '--timeout=3600'
      - '--min-instances=2'

  # Deploy ingestion worker: hawanama-ingest (private, OIDC-only, sized for bursty bulk writes)
  # Same image, same secrets, but isolated CPU/memory so ingestion never starves the public API.
  # OPENAQ_API_KEY must exist in Secret Manager before this step runs (the deploy fails otherwise);
  # the OpenAQ adapter stays off until OPENAQ_ENABLED=true is set here after a reviewed dry run.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'hawanama-ingest'
      - '--image=asia-south1-docker.pkg.dev/hawanama-2/cloud-run-source-deploy/hawanama:latest'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--no-allow-unauthenticated'
      - '--set-secrets=POSTGRES_SERVER=POSTGRES_SERVER:latest,POSTGRES_USER=POSTGRES_USER:latest,POSTGRES_PASSWORD=POSTGRES_PASSWORD:latest,POSTGRES_DB=POSTGRES_DB:latest,POSTGRES_PORT=POSTGRES_PORT:latest,TASKS_API_SECRET=TASKS_API_SECRET:latest,IQAIR_API_KEY=IQAIR_API_KEY:latest,NASA_API_KEY=NASA_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,LANGFUSE_SECRET_KEY=LANGFUSE_SECRET_KEY:latest,LANGFUSE_PUBLIC_KEY=LANGFUSE_PUBLIC_KEY:latest,PUNJAB_EPA_API_KEY=PUNJAB_EPA_API_KEY:latest,FIRMS_MAP_KEY=FIRMS_MAP_KEY:latest,OPENAQ_API_KEY=OPENAQ_API_KEY:latest'
      - '--set-env-vars=OPS_MODELS_BUCKET=paqi-models-hawanama-data,OPS_OUTPUTS_BUCKET=paqi-outputs-hawanama-data,OPS_FEATURES_BUCKET=paqi-features-hawanama-data,OPS_DERIVED_BUCKET=paqi-derived-hawanama-data,OPS_GCP_PROJECT=hawanama-data,OPS_RUN_REGION=asia-south1,OPS_DAILY_JOB_NAME=estimation-daily-pipeline,OPS_RETRAIN_JOB_NAME=estimation-model-retrain,MANIFEST_GCS_BUCKET=hawanama-manifests,ALLOW_DB_STATION_FALLBACK=true,IQAIR_MAX_CALLS_PER_MIN=500,INGEST_CONCURRENCY=10,LANGFUSE_HOST=https://us.cloud.langfuse.com,INGEST_ROLE=true,OPS_TABLES_REQUIRED=true,INGEST_LEASE_TTL_S=3300,IQAIR_CREDENTIAL_ALIAS=iqair-prod,OPENAQ_ENABLED=false,OPENAQ_CREDENTIAL_ALIAS=openaq-prod,ENVIRONMENT=production'
      - '--cpu=4'
      - '--memory=4Gi'
      - '--concurrency=4'
      - '--timeout=3600'
      - '--min-instances=0'
      - '--max-instances=4'

  # Deploy public BAM push-ingest: hawanama-bam (public HTTPS, guarded by our own
  # bearer token so SFL can POST readings; BAM_ROLE=true mounts only the BAM router).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'hawanama-bam'
      - '--image=asia-south1-docker.pkg.dev/hawanama-2/cloud-run-source-deploy/hawanama:latest'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-secrets=POSTGRES_SERVER=POSTGRES_SERVER:latest,POSTGRES_USER=POSTGRES_USER:latest,POSTGRES_PASSWORD=POSTGRES_PASSWORD:latest,POSTGRES_DB=POSTGRES_DB:latest,POSTGRES_PORT=POSTGRES_PORT:latest,BAM_INGEST_TOKEN=BAM_INGEST_TOKEN:latest'
      - '--set-env-vars=BAM_ROLE=true,ENVIRONMENT=production'
      - '--cpu=1'
      - '--memory=512Mi'
      - '--concurrency=8'
      - '--timeout=60'
      - '--min-instances=0'
      - '--max-instances=2'

# Build options for faster builds
# Pass the source revision into the image so /health and /tasks/status can report it:
#   gcloud builds submit --config cloudbuild.yaml --project hawanama-2 \
#     --substitutions=_GIT_SHA=$(git rev-parse --short HEAD)
substitutions:
  _GIT_SHA: 'unknown'

options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100