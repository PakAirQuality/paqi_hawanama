# Required on every PR to main. No path filters: a required check that never reports
# blocks the merge, so each job runs on every change.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      # Settings() needs these at import time; no test opens a connection with them.
      POSTGRES_SERVER: localhost
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -m "not live" -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f apps/api/Dockerfile --build-arg GIT_SHA=${GITHUB_SHA::7} .

  dashboard-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dashboard-frontend/package-lock.json
      - run: npm ci
      # next build directly, not npm run build: PR checks use the committed station list
      # and never depend on the production API.
      - run: npx next build

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-next
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-next/package-lock.json
      - run: npm ci
      - run: npx next build

  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generated files stay out of git
        run: |
          tracked_ignored="$(git ls-files -ci --exclude-standard)"
          if [ -n "$tracked_ignored" ]; then
            echo "Tracked files that match .gitignore:"
            echo "$tracked_ignored"
            exit 1
          fi
      - name: npm scripts run on Windows
        run: |
          if grep -nE '"[^"]+": "[^"]*\brm -' apps/*/package.json; then
            echo "Use a Node one-liner instead of rm: it fails under cmd.exe."
            exit 1
          fi

  # Fails on any path Windows cannot create, such as a filename containing ':'.
  windows-checkout:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
