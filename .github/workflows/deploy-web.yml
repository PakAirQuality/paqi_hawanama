name: Deploy Public website

on:
  workflow_dispatch:
    inputs:
      preview:
        description: Deploy to a one-hour preview channel instead of the live site
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web-next
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-next/package-lock.json
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/152782825429/locations/global/workloadIdentityPools/github/providers/paqi-hawanama
          service_account: github-deployer@hawanama-2.iam.gserviceaccount.com
      - run: npm ci
      - run: printf 'NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN=%s\n' "$MAPBOX_TOKEN" > .env.production.local
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN_WEB }}
      - run: npm run build
      - if: ${{ inputs.preview }}
        run: npx --yes firebase-tools@14.18.0 hosting:channel:deploy ci-preview --expires 1h --no-authorized-domains --project hawanama-2 --non-interactive
      - if: ${{ !inputs.preview }}
        run: npx --yes firebase-tools@14.18.0 deploy --only hosting --project hawanama-2 --non-interactive
